<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courses</title>
  </head>

  <body
    class="h-screen overflow-hidden bg-slate-100 flex items-center justify-center p-4"
  >
    <main
      dir="ltr"
      class="w-full max-w-9xl h-[650px] overflow-hidden rounded-2xl bg-white shadow-xl flex"
    >
      <div id="sidebar"></div>

      <section class="flex-1 h-full px-10 py-8 overflow-hidden">
        <div class="flex items-center justify-between mb-7">
          <div>
            <p class="text-3xl font-bold text-slate-900">Courses</p>

            <p class="text-sm text-slate-500 mt-2">Manage academy courses</p>
          </div>

          <button
            id="addCourseButton"
            type="button"
            class="h-11 px-5 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700 flex items-center gap-2"
          >
            <img src="../assets/plus.svg" alt="" class="w-5 h-5 invert" />

            <span>Add Course</span>
          </button>
        </div>

        <!-- Course Detail Modal -->
        <div
          id="courseDetailModal"
          class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50"
        >
          <div class="w-full max-w-lg bg-gray-100 rounded-2xl shadow-xl p-7">
            <!-- Header -->
            <div class="flex items-center justify-between mb-6">
              <div>
                <h2 class="text-2xl font-bold text-slate-900">
                  Course Details
                </h2>
              </div>

              <button
                id="closeCourseDetailModal"
                type="button"
                class="text-red-400 hover:text-red-700 text-2xl"
              >
                ✕
              </button>
            </div>

            <!-- Details -->
            <div class="space-y-4">
              <div class="flex justify-between border-b border-slate-300 pb-3">
                <span class="text-sm text-slate-500">ID</span>
                <span id="detailId" class="font-medium text-slate-900"></span>
              </div>

              <div class="flex justify-between border-b border-slate-300 pb-3">
                <span class="text-sm text-slate-500">Title</span>
                <span
                  id="detailTitle"
                  class="font-medium text-slate-900"
                ></span>
              </div>

              <div class="flex justify-between border-b border-slate-300 pb-3">
                <span class="text-sm text-slate-500">Teacher</span>
                <span
                  id="detailTeacher"
                  class="font-medium text-slate-900"
                ></span>
              </div>

              <div class="flex justify-between border-b border-slate-300 pb-3">
                <span class="text-sm text-slate-500">Price</span>
                <span
                  id="detailPrice"
                  class="font-medium text-slate-900"
                ></span>
              </div>

              <div class="flex justify-between border-b border-slate-300 pb-3">
                <span class="text-sm text-slate-500">Capacity</span>
                <span
                  id="detailCapacity"
                  class="font-medium text-slate-900"
                ></span>
              </div>

              <div class="flex justify-between border-b border-slate-300 pb-3">
                <span class="text-sm text-slate-500">Duration</span>
                <span
                  id="detailDuration"
                  class="font-medium text-slate-900"
                ></span>
              </div>

              <div class="flex justify-between">
                <span class="text-sm text-slate-500">Status</span>

                <span
                  id="detailStatus"
                  class="px-3 py-1 text-xs font-medium rounded-full"
                ></span>
              </div>
            </div>
          </div>
        </div>

        <!--table-->
        <div
          class="border border-slate-200 rounded-xl shadow-sm overflow-hidden"
        >
          <div class="overflow-y-auto max-h-[500px]">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 border-b border-slate-200">
                <tr class="text-left text-slate-600">
                  <th class="px-4 py-4 font-semibold">ID</th>

                  <th class="px-4 py-4 font-semibold">Title</th>

                  <th class="px-4 py-4 font-semibold">Details</th>

                  <th class="px-4 py-4 font-semibold text-center">Active</th>

                  <th class="px-4 py-4 font-semibold text-center">Actions</th>
                </tr>
              </thead>

              <tbody
                id="coursesTableBody"
                class="divide-y divide-slate-100"
              ></tbody>
            </table>
          </div>
        </div>

        <p id="coursesError" class="hidden text-sm text-red-500 mt-4"></p>
      </section>
    </main>

    <!-- add course modal -->
    <div
      id="addCourseModal"
      class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50"
    >
      <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-7">
        <div class="flex items-center justify-between mb-6">
          <h2 class="text-2xl font-bold text-slate-900">Add Course</h2>

          <button
            id="closeAddCourseModal"
            type="button"
            class="text-red-400 hover:text-red-700 text-xl"
          >
            ✕
          </button>
        </div>

        <!-- Form -->
        <form id="addCourseForm" class="space-y-4">
          
          <div>
            <label
              for="addTitle"
              class="block text-sm font-medium text-slate-700 mb-1"
            >
              Title
            </label>

            <input
              id="addTitle"
              type="text"
              class="w-full h-11 px-4 rounded-lg border border-slate-200 outline-none focus:border-indigo-600"
            />
          </div>

          
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label
                for="addPrice"
                class="block text-sm font-medium text-slate-700 mb-1"
              >
                Price
              </label>

              <input
                id="addPrice"
                type="number"
                class="w-full h-11 px-4 rounded-lg border border-slate-200 outline-none focus:border-indigo-600"
              />
            </div>

            <div>
              <label
                for="addCapacity"
                class="block text-sm font-medium text-slate-700 mb-1"
              >
                Capacity
              </label>

              <input
                id="addCapacity"
                type="number"
                class="w-full h-11 px-4 rounded-lg border border-slate-200 outline-none focus:border-indigo-600"
              />
            </div>
          </div>

          
          <div>
            <label
              for="addTeacher"
              class="block text-sm font-medium text-slate-700 mb-1"
            >
              Teacher
            </label>

            <input
              id="addTeacher"
              type="text"
              class="w-full h-11 px-4 rounded-lg border border-slate-200 outline-none focus:border-indigo-600"
            />
          </div>

          
          <div>
            <label
              for="addDuration"
              class="block text-sm font-medium text-slate-700 mb-1"
            >
              Duration
            </label>

            <input
              id="addDuration"
              type="number"
              class="w-full h-11 px-4 rounded-lg border border-slate-200 outline-none focus:border-indigo-600"
            />
          </div>

          
          <label class="flex items-center gap-3">
            <input id="addIsActive" type="checkbox" class="w-4 h-4" />

            <span class="text-sm text-slate-700"> Active </span>
          </label>

          
          <div class="flex justify-end gap-3 pt-4">
            <button
              id="cancelAddCourse"
              type="button"
              class="px-5 h-10 rounded-lg border border-slate-200 text-slate-700"
            >
              Cancel
            </button>

            <button
              type="submit"
              class="px-5 h-10 rounded-lg bg-indigo-600 text-white font-semibold"
            >
              Add Course
            </button>
          </div>
        </form>
      </div>
    </div>

    

    
    <!-- DELETE COURSE MODAL -->
    <div
      id="deleteCourseModal"
      class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50"
    >
      <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-7">
        
        <div class="flex justify-center mb-5">
          <div
            class="w-14 h-14 rounded-full bg-red-100 flex items-center justify-center"
          >
            <img
              id="deleteModalIcon"
              src="../assets/trash.svg"
              alt=""
              class="w-7 h-7"
            />
          </div>
        </div>

        
        <h2 class="text-xl font-bold text-center text-slate-900">
          Delete Course
        </h2>

        
        <p class="text-sm text-slate-500 text-center mt-3">
          Are you sure you want to delete this course?
        </p>

        
        <p
          id="deleteCourseTitle"
          class="text-center font-semibold text-slate-800 mt-2"
        ></p>

        
        <p
          id="deleteCourseError"
          class="hidden text-sm text-red-500  text-center mt-4"
        ></p>

        
        <div class="flex justify-center gap-3 mt-7">
          <button
            id="cancelDeleteCourse"
            type="button"
            class="px-5 h-10 rounded-lg border border-slate-200 hover:bg-slate-300  text-slate-700"
          >
            Cancel
          </button>

          <button
            id="confirmDeleteCourse"
            type="button"
            class="px-5 h-10 rounded-lg bg-red-500 hover:bg-red-700 text-white font-semibold"
          >
            Delete
          </button>
        </div>
      </div>
    </div>

    
    <script type="module" src="../js/courses.js"></script>
    <script type="module" src="../js/navigation.js"></script>
  </body>
</html>
